    testImplementation 'androidx.paging:paging-common:2.1.2'
//    implementation "uk.co.samuelwall:material-tap-target-prompt:$rootProject.material"
//    implementation "jp.wasabeef:recyclerview-animators:$rootProject.animator"
//    implementation "com.ethanhua:skeleton:$rootProject.skeleton"
//    implementation "io.supercharge:shimmerlayout:$rootProject.shimmerlayout"
    implementation "org.jetbrains.kotlin:kotlin-stdlib-jdk7:$kotlin_version"
    implementation "com.github.ybq:Android-SpinKit:$rootProject.spinkit"
    implementation "uk.co.samuelwall:material-tap-target-prompt:$rootProject.ext.target_prompt"
    implementation 'com.github.lzyzsd:circleprogress:1.2.1'

//to zoom an imageView
//    implementation "me.relex:photodraweeview:$rootProject.photodraweeview"
//    implementation "com.facebook.fresco:fresco:$rootProject.fresco"
  //  implementation "com.facebook.stetho:stetho-okhttp3:$rootProject.stetho"
    implementation "com.facebook.android:facebook-android-sdk:$rootProject.ext.facebook_android_sdk"
