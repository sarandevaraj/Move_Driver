apply plugin: 'com.android.application'
apply plugin: 'kotlin-android'
apply plugin: 'kotlin-android-extensions'
apply plugin: 'kotlin-kapt'
apply plugin: 'com.google.firebase.crashlytics'
// apply plugin: 'io.fabric'
android {
    compileSdkVersion 31
    signingConfigs {
        release_config {
            try {
                storeFile file('/home/developer/Documents/Android Project/Snape/snapecabs_andr/app/keystore/keystore.jks')
                storePassword 'taximobility'
                keyAlias 'taximobility'
                keyPassword 'taximobility'
            } catch (Exception ex) {
                throw new InvalidUserDataException("You should define KEYSTORE_PASSWORD and KEY_PASSWORD in gradle.properties.")
            }
        }
    }


    defaultConfig {
        applicationId "$rootProject.ext.packageName"
        minSdkVersion 19
        targetSdkVersion 31
        signingConfig signingConfigs.release_config
        multiDexEnabled true
        vectorDrawables.useSupportLibrary = true
        ndk.abiFilters 'armeabi-v7a','arm64-v8a','x86','x86_64'
        compileOptions {
            sourceCompatibility JavaVersion.VERSION_1_8
            targetCompatibility JavaVersion.VERSION_1_8
        }
    }
    configurations {
        all*.exclude group: 'com.android.support', module: 'support-v13'
    }
    // Temporary fix until alpha10
    packagingOptions {
        exclude 'META-INF/proguard/androidx-annotations.pro'
    }
    buildTypes {
        release {
            minifyEnabled false
            shrinkResources false
            debuggable false
            proguardFiles getDefaultProguardFile('proguard-android.txt'), 'proguard-rules.pro'
            //proguardFiles getDefaultProguardFile('proguard-rules.txt')
            resValue "string", "googleID", "$rootProject.ext.googleID"
            resValue "string", "common_name", "$rootProject.ext.common_name"
            resValue "string", "facebookId", "$rootProject.ext.facebookId"
            resValue "string", "facebookAppId", "$rootProject.ext.facebookAppId"
        }
        debug {
            minifyEnabled false
            shrinkResources false
            debuggable true
         /*   minifyEnabled true
            shrinkResources true
            debuggable true
            useProguard true*/
            proguardFiles getDefaultProguardFile('proguard-android.txt'), 'proguard-rules.pro'
            resValue "string", "googleID", "$rootProject.ext.googleID"
            resValue "string", "common_name", "$rootProject.ext.common_name"
            resValue "string", "facebookId", "$rootProject.ext.facebookId"
            resValue "string", "facebookAppId", "$rootProject.ext.facebookAppId"
        }
    }
    lintOptions {
        checkReleaseBuilds false
        disable 'InvalidPackage'
        // set to true to turn off analysis progress reporting by lint
        quiet true
        // if true, stop the gradle build if errors are found
        abortOnError false
        // if true, only report errors
        ignoreWarnings true
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }
    dexOptions {
        jumboMode = true
        javaMaxHeapSize "4g"
    }
    dataBinding {
        enabled = true
    }
    androidExtensions {
        experimental = true
    }
  /*  splits {
     *//*   density {
            enable true
            reset()
            include "ldpi", "mdpi", "hdpi","xhdpi" , "xxhdpi","xxhdpi"
        }*//*
        abi {
            enable true
            reset()
//            include "armeabi-v7a", "x86", "x86_64"
            include "x86", "armeabi-v7a", "arm64-v8a", "x86_64"
            universalApk true
        }
    }*/
}
